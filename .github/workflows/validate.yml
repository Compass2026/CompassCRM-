name: Validate CRM
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # The compass-billing Vercel project (Option B, docs/billing-runtime.md).
      - run: npm ci --prefix billing
      - run: npm run check --prefix billing
      - run: npm run build --prefix billing
      - run: npm test --prefix billing

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL for isolated migration and role tests
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Replay migrations and verify database boundaries
        run: scripts/test-portal-sandbox.sh

  blog-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install isolated database and API
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          echo 'b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  /tmp/postgrest.tar.xz' | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          sudo install /tmp/postgrest /usr/local/bin/postgrest
      - name: Review a fictional blog through the real browser and database
        run: npm run test:blog-drafter-ui
      - name: Delegated copy edit through PostgREST on the replayed schema
        run: npm run test:content-edit-copy

  citations-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install isolated database and API
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          echo 'b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  /tmp/postgrest.tar.xz' | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          sudo install /tmp/postgrest /usr/local/bin/postgrest
      - name: Import, verify and correct sample citations through the real browser and database
        run: CHROME_PATH=/usr/bin/google-chrome SCREENSHOTS=docs/screenshots/citations npm run test:citations-ui
      - name: Rehearse the BrightLocal campaign pilot on synthetic data
        run: CHROME_PATH=/usr/bin/google-chrome SCREENSHOTS=docs/screenshots/citations-pilot npm run test:citations-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citations-screenshots
          path: |
            docs/screenshots/citations/
            docs/screenshots/citations-pilot/

  client-growth-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify dashboard and backlink browser flows with fictional data
        run: CHROME_PATH=/usr/bin/google-chrome node --no-warnings tests/client-growth-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-growth-screenshots
          path: docs/screenshots/client-growth/

  control-center-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify Control Center evidence, filters, failures and mobile layout
        run: CHROME_PATH=/usr/bin/google-chrome node --no-warnings tests/operations-control-center-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-screenshots
          path: docs/screenshots/control-center/

  keyword-report-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the keyword results report with fictional data (read-only stub, no provider calls, client-scoped reads)
        run: CHROME_PATH=/usr/bin/google-chrome node --no-warnings tests/keyword-report-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyword-report-screenshots
          path: docs/screenshots/keyword-report/

  map-grid-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: CHROME_PATH=/usr/bin/google-chrome node --no-warnings tests/map-grid-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-grid-screenshots
          path: docs/screenshots/map-grid/
